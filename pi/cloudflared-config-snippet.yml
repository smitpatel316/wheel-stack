# Cloudflare Tunnel snippet for wheel-stack
# Add to ~/.cloudflared/config.yml BEFORE the final catch-all 404 rule
# Then: cloudflared tunnel route dns pi-tunnel <hostname> && systemctl restart cloudflared

ingress:
  # Wheel - Optionable tracker
  - hostname: wheel.smitpatel.net
    service: http://localhost:8096
  - hostname: optionable.smitpatel.net
    service: http://localhost:8096
  # Optional API for wheel-stack status
  - hostname: wheel-api.smitpatel.net
    service: http://localhost:8097
  # Webhook for Finnhub earnings real-time
  - hostname: webhook.smitpatel.net
    service: http://localhost:8644
  # Catch-all must be last
  - service: http_status:404

# DNS steps (each hostname once):
# cloudflared tunnel route dns pi-tunnel wheel.smitpatel.net
# cloudflared tunnel route dns pi-tunnel optionable.smitpatel.net
# cloudflared tunnel route dns pi-tunnel webhook.smitpatel.net
# Wait 60s, curl -sI https://wheel.smitpatel.net should be 200
