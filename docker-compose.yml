# Wheel Stack — Unified Options Wheel + Optionable + Hermes Agentic
# Pi budupi, paper $100k hybrid v2.5.3/v2.6.0, Model-First: Earnings+Dividend+Fundamentals+Volatility Context -> Closer 50% -> Roller 3% -> Wheel -> SGOV SPAXX -> Optionable
# Production uses Hermes cron (options-wheel-agentic), not docker cron — see hermes/cron/README.md
# Merged from parallel builders: scaffold + P/L fix (closePrice=0 bug $568->$52) + hermes layer + docker/pi/docs

services:
  optionable:
    container_name: optionable
    image: yomikoye/optionable:latest
    ports:
      - "8096:8080"
    environment:
      - TZ=America/Los_Angeles
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=8080
    volumes:
      # Primary: Pi legacy DB path (existing 15 trades at /home/smitpatel316/optionable-data)
      - /home/smitpatel316/optionable-data:/data
      # Fallback for fresh clones: uncomment next line if host path missing, run mkdir -p optionable-data
      # - ./optionable-data:/data
    restart: unless-stopped
    networks:
      - wheel-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "com.wheel-stack.service=optionable"
      - "com.wheel-stack.version=v0.16.0"
      - "com.wheel-stack.fixed=pl-568-bug-v2.6"

  # Optional: Wheel API — lightweight FastAPI exposing strategy status, P/L reconciliation
  # Not required for cron (cron uses Hermes), start manually with --profile api
  wheel-api:
    container_name: wheel-api
    build:
      context: .
      dockerfile: Dockerfile.wheel-api
    image: wheel-stack/api:latest
    ports:
      - "8097:8097"
    environment:
      - TZ=America/Los_Angeles
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - IS_PAPER=${IS_PAPER:-true}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - OPTIONABLE_URL=http://optionable:8080
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      optionable:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wheel-net
    profiles:
      - api
    labels:
      - "com.wheel-stack.service=wheel-api"
      - "com.wheel-stack.version=v2.6.0"

  # Optional: Wheel Runner — manual testing without Hermes cron or MCP
  # Simulates agentic phases 0.1-6 via Python broker_client, for CI / local validation
  # Start with: sg docker -c 'docker compose --profile manual run --rm wheel-runner python scripts/run_strategy.py --dry-run'
  wheel-runner:
    container_name: wheel-runner
    image: python:3.12-slim
    profiles:
      - manual
    working_dir: /app
    environment:
      - TZ=America/Los_Angeles
      - IS_PAPER=true
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - OPTIONABLE_URL=http://optionable:8080
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      optionable:
        condition: service_healthy
    networks:
      - wheel-net
    labels:
      - "com.wheel-stack.service=wheel-runner"

  # Doc service: reminder that real agentic execution is via Hermes cron, not docker
  wheel-cron-doc:
    container_name: wheel-cron-doc
    image: alpine:latest
    profiles:
      - never  # never auto-start, just documentation
    entrypoint: ["sh", "-c", "echo 'Production uses Hermes cron: hermes cronjob create --schedule \"5 7,10,12 * * 1-5\" --name options-wheel-agentic --skills options-wheel-trading,alpaca-mcp --prompt $$(cat hermes/cron/options-wheel-agentic.prompt.md)' && sleep infinity"]
    labels:
      - "com.wheel-stack.service=wheel-cron-doc"

networks:
  wheel-net:
    name: wheel-net
    driver: bridge

volumes:
  optionable-data:
    name: optionable-data
    driver: local
  wheel-logs:
    name: wheel-logs
